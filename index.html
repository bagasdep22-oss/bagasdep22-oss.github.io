  <script>
    (function() {
      try {
        // Cek apakah pengunjung sudah pernah menekan tombol tema secara sadar
        if (localStorage.getItem('user_clicked_theme') !== 'true') {
          // Jika belum, timpa setelan lama (termasuk yang sudah terlanjur milih terang)
          localStorage.setItem('theme', 'dark');
          // Langsung aplikasikan warna gelap ke HTML agar tidak ada kedipan putih
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      } catch (e) {}
    })();

    // Mendeteksi jika pengunjung mengklik tombol bulan/matahari
    window.addEventListener('load', function() {
      setTimeout(function() {
        const tombolTema = document.querySelectorAll('button, a');
        tombolTema.forEach(btn => {
          // Jika tombolnya punya ikon bulan atau matahari
          if (btn.querySelector('.lucide-moon') || btn.querySelector('.lucide-sun')) {
            btn.addEventListener('click', function() {
              // Tandai bahwa dia sudah memilih secara sadar, biar besok tidak dipaksa gelap lagi
              localStorage.setItem('user_clicked_theme', 'true');
            });
          }
        });
      }, 1000);
    });

  <script>
    function sembunyikanCTA() {
      // Cari semua judul (h2) di halaman
      const semuaH2 = document.querySelectorAll('h2');
      
      semuaH2.forEach(h2 => {
        // Jika judulnya mengandung "Mau kolaborasi"
        if (h2.textContent.includes('Mau kolaborasi')) {
          // Cari elemen <section> terdekat yang membungkusnya
          const sectionInduk = h2.closest('section');
          if (sectionInduk) {
            // Sembunyikan section tersebut secara total
            sectionInduk.style.setProperty('display', 'none', 'important');
          }
        }
      });
    }

    // Jalankan saat halaman dimuat, dan ulangi setiap 1 detik untuk mengantisipasi React
    window.addEventListener('load', sembunyikanCTA);
    setInterval(sembunyikanCTA, 1000);
  </script>


  


  <script>
    function sembunyikanIkonFooter() {
      // Cari semua tag <a> (link) di seluruh halaman
      const semuaLink = document.querySelectorAll('a');
      
      semuaLink.forEach(link => {
        const href = link.getAttribute('href') || '';
        
        // Jika link mengarah ke Instagram atau TikTok
        if (href.includes('instagram.com') || href.includes('tiktok.com')) {
          // Cek apakah ini tombol bulat (seperti di footer) atau berisi ikon sosmed
          const isTombolBulat = link.classList.contains('rounded-full') || link.classList.contains('size-11');
          const punyaIkonSosmed = link.querySelector('.lucide-instagram') || link.querySelector('.lucide-music-2');
          
          // Sembunyikan jika itu tombol bulat di footer (bukan kotak panjang di kontak)
          if (isTombolBulat || (punyaIkonSosmed && !link.textContent.includes('Kelas'))) {
            link.style.setProperty('display', 'none', 'important');
          }
        }
      });
    }

    // Jalankan terus menerus untuk memastikan React tidak memunculkannya lagi
    window.addEventListener('load', sembunyikanIkonFooter);
    setInterval(sembunyikanIkonFooter, 1000);
  </script>


  


  


  


  


  


  


  


  


  


  


  


  


  


  


  


  


  


  <script>
    function jalankanAnimasiAngka() {
      // Cari semua angka statistik
      const numberSpans = document.querySelectorAll('p.font-display.text-5xl.font-bold span');
      
      numberSpans.forEach(span => {
        // Jika belum dianimasikan, jalankan
        if (!span.hasAttribute('data-animated')) {
          const targetText = span.innerText;
          const targetNumber = parseInt(targetText, 10);
          
          if (!isNaN(targetNumber) && targetNumber > 0) {
            span.setAttribute('data-animated', 'true'); // Kunci agar tidak berulang
            span.innerText = '0'; 
            
            let currentNumber = 0;
            const increment = Math.ceil(targetNumber / 30); // Bagi jadi 30 langkah
            
            const timer = setInterval(() => {
              currentNumber += increment;
              if (currentNumber >= targetNumber) {
                span.innerText = targetNumber; // Berhenti di angka pas
                clearInterval(timer);
              } else {
                span.innerText = currentNumber;
              }
            }, 40); // 40ms per langkah (total ~1.2 detik)
          }
        }
      });
    }

    // Jalankan saat load, dan panggil ulang berkala jika React merender ulang halaman
    window.addEventListener('load', () => {
      setTimeout(jalankanAnimasiAngka, 1000); // Tunggu 1 detik untuk render awal
      setInterval(jalankanAnimasiAngka, 3000); // Cek tiap 3 detik kalau ada elemen baru
    });
  </script>


  <script>
    function sembunyikanTombolNavbar() {
      const links = document.querySelectorAll('a');
      
      links.forEach(link => {
        // Jika ini adalah link "Hubungi Kami" dan punya ikon panah
        if (link.textContent.includes('Hubungi Kami') && link.querySelector('svg')) {
          
          let foundThemeToggle = false;
          let parent = link.parentElement;
          
          // Cek wadah induknya, apakah ada ikon bulan/matahari di sebelahnya
          if (parent) {
            const siblings = parent.querySelectorAll('svg');
            siblings.forEach(svg => {
              if (svg.classList.contains('lucide-moon') || svg.classList.contains('lucide-sun')) {
                foundThemeToggle = true;
              }
            });
          }

          // Jika ketemu wadahnya (ada ikon bulan), sembunyikan tombolnya
          if (foundThemeToggle) {
            link.style.setProperty('display', 'none', 'important');
          } else {
            // Cadangan: Jika tombolnya ada di tag <header> atau <nav> dan bentuknya pill (rounded-full)
            if ((link.closest('header') || link.closest('nav')) && link.className.includes('rounded-full')) {
               link.style.setProperty('display', 'none', 'important');
            }
          }
        }
      });
    }

    // Jalankan terus menerus untuk memastikan React tidak memunculkannya lagi
    window.addEventListener('load', sembunyikanTombolNavbar);
    setInterval(sembunyikanTombolNavbar, 1000);
  </script>
