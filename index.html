  <script>
    function sembunyikanCTA() {
      // Cari semua judul (h2) di halaman
      const semuaH2 = document.querySelectorAll('h2');
      
      semuaH2.forEach(h2 => {
        // Jika judulnya mengandung "Mau kolaborasi"
        if (h2.textContent.includes('Mau kolaborasi')) {
          // Cari elemen <section> terdekat yang membungkusnya
          const sectionInduk = h2.closest('section');
          if (sectionInduk) {
            // Sembunyikan section tersebut secara total
            sectionInduk.style.setProperty('display', 'none', 'important');
          }
        }
      });
    }

    // Jalankan saat halaman dimuat, dan ulangi setiap 1 detik untuk mengantisipasi React
    window.addEventListener('load', sembunyikanCTA);
    setInterval(sembunyikanCTA, 1000);
  </script>


  


  <script>
    function sembunyikanIkonFooter() {
      // Cari semua tag <a> (link) di seluruh halaman
      const semuaLink = document.querySelectorAll('a');
      
      semuaLink.forEach(link => {
        const href = link.getAttribute('href') || '';
        
        // Jika link mengarah ke Instagram atau TikTok
        if (href.includes('instagram.com') || href.includes('tiktok.com')) {
          // Cek apakah ini tombol bulat (seperti di footer) atau berisi ikon sosmed
          const isTombolBulat = link.classList.contains('rounded-full') || link.classList.contains('size-11');
          const punyaIkonSosmed = link.querySelector('.lucide-instagram') || link.querySelector('.lucide-music-2');
          
          // Sembunyikan jika itu tombol bulat di footer (bukan kotak panjang di kontak)
          if (isTombolBulat || (punyaIkonSosmed && !link.textContent.includes('Kelas'))) {
            link.style.setProperty('display', 'none', 'important');
          }
        }
      });
    }

    // Jalankan terus menerus untuk memastikan React tidak memunculkannya lagi
    window.addEventListener('load', sembunyikanIkonFooter);
    setInterval(sembunyikanIkonFooter, 1000);
  </script>
